name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files
        run: |
          echo "java files: $(find . -name '*.java' | wc -l)"
          find . -name 'Looksmaxxing.java'
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'
          cache-disabled: true
      - name: Build
        run: gradle build --no-daemon
      - name: Show jar
        if: always()
        run: |
          ls -la build/libs || true
          unzip -l build/libs/*.jar | head -30 || true
      - uses: actions/upload-artifact@v4
        with:
          name: looksmaxxing-jar
          path: build/libs/*.jar
          if-no-files-found: error
